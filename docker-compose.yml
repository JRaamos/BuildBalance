services:
  postgres:
    image: postgres:16-alpine
    container_name: buildbalance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildbalance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - buildbalance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildbalance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buildbalance_postgres:
